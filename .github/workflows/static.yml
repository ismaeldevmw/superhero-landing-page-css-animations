# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install dependencies (CI)
        run: npm install

      - name: Build
        run: npm run build

      # optional: remove symlinks that break Pages deploy (if build outputs to ./public)
      - name: Remove symlinks from public
        run: find ./public -type l -delete || true

      - name: Prepare Pages artifact (dereference symlinks)
        run: |
          if [ -d "./public" ]; then
            rm -rf out || true
            mkdir out
            # rsync -aL copies files and follows symlinks (dereference)
            rsync -aL ./public/ out/
            echo "Prepared out/ (size):"
            du -sh out || true
            echo "Any remaining symlinks (should be none):"
            find out -type l -ls || true
          else
            echo "Directory ./public not found. Nothing to upload."
            ls -la || true
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
